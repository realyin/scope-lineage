[project]
name = "scope-lineage-service"
version = "0.1.0"
description = "HTTP and MCP servers for the scope-lineage catalog answer commands, with an optional ask panel"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# The core package stays free of web, model and vector dependencies: this separately
# packaged directory is where the servers and their one protocol dependency live.
# `scope_lineage.cli_catalog_answers` first ships in 0.16.0; the page's answers (--answers)
# need its 0.17.0 additions: `overlay_answers`, and the `page_states` the context pack and
# the questions board take (with the answers they carry).
dependencies = ["scope-lineage>=0.17", "mcp>=2.3,<3"]

[project.optional-dependencies]
# The ask panel (`http --ask`): a model answers data questions on the server through the
# catalog tools. Imported lazily; without it every other endpoint, the MCP server and the
# browse page work, and asking reports that the package is missing.
ask = ["anthropic>=1.7,<2"]
# OpenAI-compatible endpoints in an --ask-models file (privately hosted models and other
# vendors speaking the Chat Completions API): the official openai SDK, imported lazily
# like the one above; without it such a model is listed as unavailable.
ask-openai = ["openai>=1.40,<3"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
scope-lineage-service = "scope_lineage_service.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scope_lineage_service*"]

[tool.setuptools.package-data]
# The browse page: plain HTML, CSS and JavaScript served by the HTTP server, no build step.
# ask/*.md: exact copies of the skill's walk, the ask panel's instructions (a test holds
# them to skills/scope-lineage/).
scope_lineage_service = ["static/*.html", "static/*.css", "static/*.js", "ask/*.md"]
