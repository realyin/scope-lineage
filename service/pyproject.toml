[project]
name = "scope-lineage-service"
version = "0.1.0"
description = "Read-only HTTP and MCP servers for the scope-lineage catalog answer commands"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# The core package stays free of web, model and vector dependencies: this separately
# packaged directory is where the servers and their one protocol dependency live.
# `scope_lineage.cli_catalog_answers` first ships in the release after 0.15.0; until then
# install the core from this repository (`pip install -e .` at its root).
dependencies = ["scope-lineage>=0.15", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
scope-lineage-service = "scope_lineage_service.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scope_lineage_service*"]

[tool.setuptools.package-data]
# The browse page: plain HTML, CSS and JavaScript served by the HTTP server, no build step.
scope_lineage_service = ["static/*.html", "static/*.css", "static/*.js"]
