id: "https://example.org/scope-lineage/ontology/corpus"
name: "corpus"
title: "scope-lineage ontology candidate"
description: "Exported from an ontology candidate over a SQL corpus. Every element is an observation, not a curated business ontology: read the tier annotation before trusting a slot."
prefixes:
  linkml: "https://w3id.org/linkml/"
  sl: "https://example.org/scope-lineage/ontology#"
  cst: "https://example.org/scope-lineage/ontology/constraint/"
default_prefix: "sl"
default_range: "string"
imports:
  - "linkml:types"
annotations:
  source_doc_format: "ontology-json/2"
  task_count: 5
  provisional_count: 8
  "sl:open_item_open:rel:ods.channel_event.channel_code->dim.channel.channel_code": "relation (hypothesis) on ods.channel_event [channel_code]: 关系 `ods.channel_event` → `dim.channel` 的基数写作「多对一，作者假设」，依据只是直接关联未去重，作者假设对端按该键唯一。 (write back: 关系:ods.channel_event.channel_code->dim.channel.channel_code)"
  "sl:open_item_open:key:dim.channel=channel_code": "candidate_key (hypothesis) on dim.channel [channel_code]: 候选键 `channel_code`：只有任务直接关联时的假设，语料没有证明它唯一。 (write back: 键:dim.channel=channel_code)"
enums:
  mart_channel_summary__channel_name_enum:
    description: "the closed value set of column channel_name"
    annotations:
      "cst:002": "in_set (proven) on channel_name; observed values: OFFLINE, ONLINE"
    permissible_values:
      OFFLINE: {}
      ONLINE: {}
classes:
  Entity:
    abstract: true
    title: "Entity"
    description: "a business thing that persists through time (a continuant)"
    annotations:
      concept_kind: "entity"
      category: "continuant"
  Event:
    abstract: true
    title: "Event"
    description: "something that happened to the business (an occurrent)"
    annotations:
      concept_kind: "event"
      category: "occurrent"
  Summary:
    abstract: true
    title: "Summary"
    description: "a figure aggregated over entities or events (an aggregate)"
    annotations:
      concept_kind: "summary"
      category: "aggregate"
  dim_channel:
    title: "dim.channel"
    description: "渠道维表（合成）"
    annotations:
      entity_kind: "physical_table"
      tier: "proven"
      domain: "渠道域"
      represents: "concept:channel (primary)"
    attributes:
      channel_code:
        range: "string"
        annotations:
          tier: "proven"
          key_tier: "hypothesis"
      channel_name:
        range: "string"
        annotations:
          tier: "proven"
    unique_keys:
      key_channel_code:
        unique_key_slots:
