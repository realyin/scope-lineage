name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # contents: write is required to upload dist files as Release Assets.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          actual_tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{version}"
          if actual_tag != expected_tag:
              # The usual cause is ordering: the release was cut from a commit that predates
              # the version bump, so the tag names a version pyproject.toml has not reached
              # yet. Saying only which two strings differ leaves the reader to rediscover
              # that every time, so name the likely cause and the way out.
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match package version "
                  f"{version!r}; expected {expected_tag!r}.\n"
                  f"The commit this release points at still declares {version!r}. "
                  f"If {actual_tag!r} is the version you meant to ship, the bump commit is "
                  f"probably not included: delete this release and its tag, then create it "
                  f"again from the commit that sets the version. Otherwise bump "
                  f"pyproject.toml to {actual_tag.lstrip('v')!r} first."
              )
          print(f"Release tag {actual_tag} matches package version {version}")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python tests/architecture/verify_distribution.py dist/*

      - name: Upload distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scope-lineage
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
