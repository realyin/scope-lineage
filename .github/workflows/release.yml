name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to verify and publish
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      PRIVATE_SURFACE_TERMS: ${{ secrets.PRIVATE_SURFACE_TERMS }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Require a draft release and private terms
        run: |
          test -n "$PRIVATE_SURFACE_TERMS"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          printf '%s\n' "$PRIVATE_SURFACE_TERMS" > /tmp/private-surface-terms.txt
          gh release view "$RELEASE_TAG" --json body --jq .body > /tmp/release-body.md

      - name: Verify release tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          actual_tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{version}"
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match package version "
                  f"{version!r}; expected {expected_tag!r}.\n"
                  f"The commit this release points at still declares {version!r}. "
                  f"If {actual_tag!r} is the version you meant to ship, the bump commit is "
                  f"probably not included: delete this draft and its tag, then create it "
                  f"again from the commit that sets the version. Otherwise bump "
                  f"pyproject.toml to {actual_tag.lstrip('v')!r} first."
              )
          print(f"Release tag {actual_tag} matches package version {version}")
          PY

      - name: Scan release surfaces before publication
        run: |
          SCAN="python tests/architecture/private_surface_scan.py --private-terms-file /tmp/private-surface-terms.txt --require-private-terms"
          $SCAN tree .
          $SCAN text /tmp/release-body.md
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)"
          test -n "$PREVIOUS_TAG"
          $SCAN commits "$PREVIOUS_TAG" "$RELEASE_TAG"

      - name: Build and scan distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python tests/architecture/verify_distribution.py dist/*
          python tests/architecture/private_surface_scan.py \
            --private-terms-file /tmp/private-surface-terms.txt \
            --require-private-terms archive dist/*

      - name: Upload distributions to draft release
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Upload distributions for trusted publishing
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scope-lineage
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Publish verified GitHub release
        run: gh release edit "$RELEASE_TAG" --draft=false
